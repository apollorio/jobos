schema_version: 1
policy_version: matching-v8-family-audit
method: deterministic
weights:
  mandatory: 1.0
  desirable: 0.45
  responsibility: 0.65
  ambiguous: 0.65
status_values: {met: 1.0, partial: 0.5, gap: 0.0}   # unknown vale zero no total; cobertura separada
min_coverage_for_score: 0.6
decision_thresholds:
  good_fit: 70
  weak_fit: 40
ai:
  enabled: false        # provider opcional; perfil não é enviado a serviço externo por padrão
  provider: null
  timeout_seconds: 60
  budget_per_run: 0
