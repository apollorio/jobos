     params: {base: "https://careers.subsea7.com", location: "Rio de Janeiro"}, board_url: "https://careers.subsea7.com",
     coverage: filtered_board, priority: 1, configuration_origin: jobs_json+companies_yml}
  - {source_id: sbm-sf, company_id: sbm, company_name: SBM Offshore, platform: successfactors_j2w, primary_adapter: j2w_search,
