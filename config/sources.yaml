  - {source_id: vibra-gupy, company_id: vibra, company_name: Vibra Energia, platform: gupy, primary_adapter: gupy_tenant, fallback_adapters: [gupy_portal_company],
     params: {tenant: vibraenergia, portal_name: "Vibra Energia"}, board_url: "https://vibraenergia.gupy.io/", priority: 2, configuration_origin: jobs_json+companies_yml}

  # ---------------- SAP SuccessFactors (Jobs2Web) ----------------
