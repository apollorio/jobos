     params: {tenant: bakerhughes, site: BakerHughes, dc: wd5, search_text: "Brazil"}, board_url: "https://bakerhughes.wd5.myworkdayjobs.com/BakerHughes",
     coverage: filtered_board, priority: 2, configuration_origin: jobs_json+companies_yml}
  # 24/10/2026: tenant Workday inexistente (CXS technipfmc/TechnipFMC/wd1 responde HTTP 422). O site de carreiras real e
  # SuccessFactors Jobs2Web (careers.technipfmc.com; busca "Brazil" = 8 vagas, dry-run complete). source_id mantido p/ historico.
  - {source_id: technipfmc-workday, company_id: technipfmc, company_name: TechnipFMC, platform: successfactors_j2w, primary_adapter: j2w_search,
     params: {base: "https://careers.technipfmc.com", location: "Brazil"}, board_url: "https://careers.technipfmc.com",
     coverage: filtered_board, priority: 1, configuration_origin: companies_yml,
     note: "Antes workday_cxs (HTTP 422); migrado para j2w_search em 24/10/2026."}

  # ---------------- SmartRecruiters ----------------
  - {source_id: aker-smart, company_id: aker, company_name: Aker Solutions, platform: smartrecruiters, primary_adapter: smartrecruiters,
     params: {company_id: akersolutions, country: br}, coverage: filtered_board, priority: 2, configuration_origin: jobs_json}
  - {source_id: airswift-smart, company_id: airswift, company_name: Airswift, platform: smartrecruiters, primary_adapter: smartrecruiters,
     params: {company_id: airswift, country: br}, coverage: filtered_board, priority: 1, configuration_origin: jobs_json}

  # ---------------- Outras plataformas ----------------
  - {source_id: oceanpact-inhire, company_id: oceanpact, company_name: OceanPact, platform: inhire, primary_adapter: inhire,
     params: {tenant: oceanpact}, board_url: "https://oceanpact.inhire.app/vagas", priority: 1, configuration_origin: jobs_json+companies_yml,
