     params: {tenant: equinor, site: EQNR, dc: wd3, search_text: "Brazil"}, board_url: "https://equinor.wd3.myworkdayjobs.com/EQNR",
     coverage: filtered_board, priority: 1, configuration_origin: jobs_json+companies_yml}
  - {source_id: shell-workday, company_id: shell, company_name: Shell, platform: workday, primary_adapter: workday_cxs,
     params: {tenant: shell, site: ShellCareers, dc: wd3, search_text: "Rio de Janeiro"}, board_url: "https://shell.wd3.myworkdayjobs.com/ShellCareers",
