  - {source_id: sapura-vagas, company_id: sapura, company_name: "Sapura (Seagems)", platform: vagas_com_br, primary_adapter: vagas_com_br,
     params: {slug: seagems}, board_url: "https://trabalheconosco.vagas.com.br/seagems/oportunidades", priority: 2, configuration_origin: companies_yml}

