  # ---------------- Descoberta agregada (desativada) ----------------
  - {source_id: gupy-portal-queries, company_id: gupy-portal, company_name: "Portal Gupy (consultas)", platform: gupy_portal,
     primary_adapter: gupy_portal_search, enabled: false, coverage: incremental_query, priority: 3, configuration_origin: queries_yml,
