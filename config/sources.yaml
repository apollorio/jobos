# Cadastro único de fontes. Um leitor principal por fonte (DEC-003).
# configuration_origin: de onde veio a configuração; verification_status: needs_current_probe até smoke test real.
# coverage: full_board | filtered_board | incremental_query | single_posting
schema_version: 1
defaults:
  enabled: true
  ownership: discovery_only
  verification_status: needs_current_probe
  limits: {timeout_seconds: 25, max_attempts: 3, max_pages: 15, max_details: 25, detail_ttl_days: 7}

sources:
  # ---------------- Gupy (página própria da empresa) ----------------
  - {source_id: prio-gupy, company_id: prio, company_name: PRIO, platform: gupy, primary_adapter: gupy_tenant, fallback_adapters: [gupy_portal_company],
     params: {tenant: prio, portal_name: "PRIO"}, board_url: "https://prio.gupy.io/", priority: 1, configuration_origin: jobs_json+companies_yml}
  - {source_id: modec-gupy, company_id: modec, company_name: MODEC, platform: gupy, primary_adapter: gupy_tenant, fallback_adapters: [gupy_portal_company],
     params: {tenant: modec-br, portal_name: "MODEC"}, board_url: "https://modec-br.gupy.io/", priority: 1, configuration_origin: jobs_json+companies_yml}
  - {source_id: norsul-gupy, company_id: norsul, company_name: Norsul, platform: gupy, primary_adapter: gupy_tenant, fallback_adapters: [gupy_portal_company],
     params: {tenant: norsul, portal_name: "NORSUL"}, board_url: "https://norsul.gupy.io/", priority: 1, configuration_origin: jobs_json+companies_yml}
  - {source_id: brava-gupy, company_id: brava, company_name: Brava Energia, platform: gupy, primary_adapter: gupy_tenant, fallback_adapters: [gupy_portal_company],
     params: {tenants: [bravaenergia, bravaacelera, 3rpetroleum], portal_name: "Brava Energia"}, board_url: "https://bravaenergia.gupy.io/", priority: 1,
     configuration_origin: jobs_json+companies_yml+auditoria_2026-10-23, fallback_adapters: [gupy_portal_company],
     note: "Duas páginas Gupy da mesma empresa (companyId 47525): bravaenergia e bravaacelera."}
  - {source_id: wilsonsons-gupy, company_id: wilsonsons, company_name: Wilson Sons, platform: gupy, primary_adapter: gupy_tenant, fallback_adapters: [gupy_portal_company],
     params: {tenant: wilsonsons, portal_name: "Wilson Sons"}, board_url: "https://wilsonsons.gupy.io/", priority: 2, configuration_origin: jobs_json}
  - {source_id: ocyan-gupy, company_id: ocyan, company_name: Ocyan, platform: gupy, primary_adapter: gupy_tenant, fallback_adapters: [gupy_portal_company],
     params: {tenants: [ocyan, ocyan-motaengil], portal_name: "Ocyan"}, board_url: "https://ocyan.gupy.io/", priority: 1, configuration_origin: jobs_json+companies_yml}
  - {source_id: qualidados-gupy, company_id: qualidados, company_name: Qualidados, platform: gupy, primary_adapter: gupy_tenant, fallback_adapters: [gupy_portal_company],
     params: {tenant: qualidados, portal_name: "Qualidados"}, board_url: "https://qualidados.gupy.io/", priority: 1, configuration_origin: jobs_json+companies_yml}
  - {source_id: oceanica-gupy, company_id: oceanica, company_name: Oceânica, platform: gupy, primary_adapter: gupy_tenant, fallback_adapters: [gupy_portal_company],
     params: {tenant: sejaoceanica, portal_name: "Oceânica "}, board_url: "https://sejaoceanica.gupy.io/", priority: 2, configuration_origin: jobs_json+companies_yml}
  - {source_id: vinci-gupy, company_id: vinci, company_name: VINCI Energies, platform: gupy, primary_adapter: gupy_tenant, fallback_adapters: [gupy_portal_company],
     params: {tenants: [vinci-energies, programa-estagio-ve], portal_name: "VINCI Energies e suas marcas de atuação: Actemium, Axians e Omexom"}, board_url: "https://vinci-energies.gupy.io/", priority: 2, configuration_origin: jobs_json+companies_yml}
  - {source_id: nexa-gupy, company_id: nexa, company_name: Nexa Tecnologia, platform: gupy, primary_adapter: gupy_tenant, fallback_adapters: [gupy_portal_company],
     params: {tenant: nexatecnologia, portal_name: "Nexa Vagas"}, board_url: "https://nexatecnologia.gupy.io/", priority: 3, configuration_origin: jobs_json+companies_yml}
  - {source_id: enauta-gupy, company_id: enauta, company_name: "Enauta / 3R", platform: gupy, primary_adapter: gupy_tenant, enabled: false, fallback_adapters: [gupy_portal_company],
     params: {tenant: 3rpetroleum}, board_url: "https://3rpetroleum.gupy.io/", priority: 2, configuration_origin: jobs_json,
     note: "DESATIVADA 23/10/2026: a página 3rpetroleum pertence à Brava (companyId 47525) e é lida por brava-gupy."}
  - {source_id: minsait-gupy, company_id: minsait, company_name: Minsait, platform: gupy, primary_adapter: gupy_tenant, fallback_adapters: [gupy_portal_company],
