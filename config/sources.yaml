     note: "DESATIVADA 23/10/2026: lia uma lista Webflow oculta (arquivo, corte em 100 itens) que o candidato não vê."}
  - {source_id: bram-totvs, company_id: bram, company_name: Bram Offshore, platform: totvs, primary_adapter: totvs,
